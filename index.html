<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>いろどり日语 · 单词背诵面板</title>
<style>
:root{--blue:#3f87c9;--blue2:#2e6da4;--head:#eaf3fb;--line:#d5e3f0;--ok:#2fa06a;--bg:#eef2f7;--txt:#2b3a4a;--mut:#8ba0b5}
*{box-sizing:border-box;margin:0}
body{font-family:"Yu Gothic","Meiryo","微软雅黑","Noto Sans JP",sans-serif;background:var(--bg);color:var(--txt)}
header{position:sticky;top:0;z-index:20;background:#ffffffee;backdrop-filter:blur(6px);border-bottom:1px solid var(--line);padding:10px 16px}
.hrow{display:flex;align-items:center;gap:12px;flex-wrap:wrap;max-width:1020px;margin:0 auto}
h1{font-size:18px;color:var(--blue2);letter-spacing:1px}
#status{font-size:12px;color:var(--mut)}
.usr{margin-left:auto;display:flex;align-items:center;gap:6px;font-size:13px;color:var(--mut)}
.usr input{width:90px;padding:5px 8px;border:1px solid var(--line);border-radius:8px;font-size:13px}
main{max-width:1020px;margin:0 auto;padding:16px}
.ov{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px;margin-bottom:14px}
.ovc{background:#fff;border-radius:12px;padding:10px 12px;cursor:pointer;border:2px solid transparent;box-shadow:0 1px 3px rgba(40,60,90,.07)}
.ovc.cur{border-color:var(--blue)}
.ovc b{font-size:14px;color:var(--blue2)}
.ovc .n{font-size:12px;color:var(--mut);margin-top:2px}
.ovbar{height:6px;background:#e6edf4;border-radius:3px;margin-top:7px;overflow:hidden}
.ovbar i{display:block;height:100%;background:linear-gradient(90deg,#7db8e8,var(--blue))}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.tab{padding:6px 12px;border-radius:18px;background:#fff;border:1px solid var(--line);font-size:13px;cursor:pointer;color:#4a6076}
.tab.cur{background:var(--blue);border-color:var(--blue);color:#fff;font-weight:700}
.ctl{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:#fff;border-radius:12px;padding:10px 12px;margin-bottom:14px;box-shadow:0 1px 3px rgba(40,60,90,.07)}
.ctl input[type=search]{flex:1;min-width:160px;padding:8px 12px;border:1px solid var(--line);border-radius:8px;font-size:14px}
.btn{padding:8px 14px;border-radius:8px;border:1px solid var(--line);background:#fff;font-size:13px;cursor:pointer;color:#4a6076;white-space:nowrap}
.btn.on{background:var(--head);border-color:var(--blue);color:var(--blue2);font-weight:700}
.btn.danger{color:#c0564f;border-color:#e5c6c2}
.stat{font-size:13px;color:var(--mut);white-space:nowrap}
.stat b{color:var(--blue2);font-size:15px}
.unit{background:#fff;border-radius:12px;margin-bottom:12px;box-shadow:0 1px 3px rgba(40,60,90,.07);overflow:hidden}
.uh{display:flex;align-items:center;gap:10px;padding:12px 14px;cursor:pointer;user-select:none}
.uh .chev{color:#9fb4c9;font-size:12px;transition:transform .15s}
.unit.open .uh .chev{transform:rotate(90deg)}
.ut{font-size:15.5px;font-weight:800;color:var(--blue2)}
.us{font-size:12px;color:var(--mut)}
.ubadge{margin-left:auto;font-size:12px;color:#fff;background:#9db8d2;border-radius:12px;padding:3px 10px;white-space:nowrap}
.ubadge.some{background:var(--ok)}.ubadge.full{background:#2fa06a}
.ubody{display:none;border-top:1px solid var(--line)}
.unit.open .ubody{display:block}
table{width:100%;border-collapse:collapse;font-size:14.5px}
th{background:var(--head);color:#3a6a99;padding:7px 8px;text-align:left;font-size:12.5px}
td{padding:6px 8px;border-top:1px solid #eaf1f8}
tr:nth-child(even) td{background:#f8fbfe}
td.no{color:#a8bbcd;width:40px;text-align:center}
td.jp{font-weight:700}
td.jp a.dic{color:inherit;text-decoration:none;border-bottom:1px dotted #b9cbdd;cursor:pointer}
td.jp a.dic:hover{color:var(--blue);border-bottom-color:var(--blue)}
td.jp a.dic::after{content:"↗";font-size:10px;color:#c3d3e3;margin-left:3px;font-weight:400}
td.jp .read{display:block;font-size:11.5px;color:#8ba0b5;font-weight:400;line-height:1.3;margin-top:1px}
body.norom td.jp .read{display:none}
td.zh{color:#41566b}
td.st{width:46px;text-align:center}
.tick{display:inline-block;width:26px;height:26px;line-height:24px;border:1.5px solid #c2d4e5;border-radius:50%;cursor:pointer;color:transparent;font-size:14px;background:#fff;user-select:none}
.tick.done{background:var(--ok);border-color:var(--ok);color:#fff}
.quiz td.zh{cursor:pointer;position:relative;color:transparent;background:#f0f5fa}
.quiz td.zh::after{content:"点击显示";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:11px;color:#9fb4c9}
.quiz td.zh.rv{color:var(--txt);background:#fdf8ec}
.quiz td.zh.rv::after{content:none}
tr.hit td{background:#fff8e6}
#nohit{background:#fff;border-radius:12px;padding:18px;text-align:center;color:#7d93a8;font-size:14px;box-shadow:0 1px 3px rgba(40,60,90,.07)}
#nohit a{color:var(--blue);text-decoration:none;font-weight:700;margin:0 6px}
#nohit a:hover{text-decoration:underline}
footer{text-align:center;color:#a5b6c6;font-size:12px;padding:10px 0 30px}
@media(max-width:640px){main{padding:10px}table{font-size:13px}h1{font-size:16px}}
@media print{header,.ctl,.tabs,footer,#nohit,.ov{display:none}.unit{page-break-after:always;box-shadow:none}.ubody{display:block!important}.tick.done{color:#fff}}
</style>
</head>

<script>
const $=s=>document.querySelector(s);
const DATA=JSON.parse($('#wd').textContent);
const BOOKS=['入門','初級1','初級2'];
let user=localStorage.getItem('wbjp-user')||'我';
let cur=localStorage.getItem('wbjp-book')||'入門';
if(!DATA[cur])cur='入門';
let quiz=false, romOn=localStorage.getItem('wbjp-rom')!=='0';
let P=JSON.parse(localStorage.getItem('wbjp-p-'+user)||'{}');
let unitOpen={};
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const doneIn=b=>Object.keys(P).filter(k=>k.startsWith(b+'-')).length;
const isOn=k=>!!P[k];
function applyRom(){document.body.classList.toggle('norom',!romOn);const b=$('#romb');if(b)b.classList.toggle('on',romOn);}

function ovCard(b){const d=doneIn(b),t=DATA[b].total,p=Math.round(d/t*100);
  return `<div class="ovc${b===cur?' cur':''}" data-b="${b}"><b>${b}（${DATA[b].level}）</b><div class="n">${d} / ${t}（${p}%）· ${DATA[b].units.length} 课</div><div class="ovbar"><i style="width:${p}%"></i></div></div>`;}

function unitHtml(u,bi){
  const b=cur,ws=u.words,d=ws.filter(w=>isOn(b+'-'+bi+'-'+w[2])).length;
  let rows='';
  for(let i=0;i<ws.length;i++){const w=ws[i];
    const read=(w[3]||w[4])?`<span class="read">${esc(w[3])}${w[3]&&w[4]?' · ':''}${esc(w[4])}</span>`:'';
    rows+=`<tr data-k="${b}-${bi}-${w[2]}"><td class="no">${i+1}</td><td class="jp"><a class="dic" href="https://dict.hjenglish.com/jp/w/${encodeURIComponent(w[0])}" target="_blank" rel="noopener" title="在沪江小D词典查看">${esc(w[0])}</a>${read}</td><td class="zh">${esc(w[1])}</td><td class="st"><span class="tick${isOn(b+'-'+bi+'-'+w[2])?' done':''}">✓</span></td></tr>`;}
  return `<div class="unit${(typeof unitOpen[bi]==='undefined'?bi===1:unitOpen[bi])?' open':''}" data-u="${bi}">
    <div class="uh"><span class="chev">▶</span><span class="ut">第 ${bi} 课 · ${esc(u.title)}</span><span class="ubadge">已背 ${d} / ${u.n}</span></div>
    <div class="ubody"><table><thead><tr><th style="width:40px;text-align:center">#</th><th>日文</th><th>中文</th><th style="width:46px;text-align:center">✓</th></tr></thead><tbody>${rows}</tbody></table></div></div>`;
}

function renderBook(){
  const b=DATA[cur],host=$('#units');
  host.innerHTML=b.units.map((u,i)=>unitHtml(u,i+1)).join('');
  if(![...host.querySelectorAll('.unit')].some(x=>x.classList.contains('open')))
    host.querySelector('.unit').classList.add('open');
  applySearch();paintCounts();
}
function paintCounts(){
  $('#ov').innerHTML=BOOKS.map(ovCard).join('');
  $('#tabs').innerHTML=BOOKS.map(b=>`<div class="tab${b===cur?' cur':''}" data-b="${b}">${b} · ${DATA[b].level}</div>`).join('');
  const d=doneIn(cur),t=DATA[cur].total;
  $('#stat').innerHTML=`本册 <b>${d}</b> / ${t}（${Math.round(d/t*100)}%）`;
  $('#tot').textContent=BOOKS.reduce((s,b)=>s+DATA[b].total,0);
  DATA[cur].units.forEach((u,i)=>{const el=$(`#units .unit[data-u="${i+1}"]`);if(!el)return;
    const dd=u.words.filter(w=>isOn(cur+'-'+(i+1)+'-'+w[2])).length;
    const bd=el.querySelector('.ubadge');bd.textContent=`已背 ${dd} / ${u.n}`;
    bd.className='ubadge'+(dd===u.n?' full':dd?' some':'');});
}
function saveLocal(){localStorage.setItem('wbjp-p-'+user,JSON.stringify(P));}
function applySearch(){
  const q=$('#q').value.trim().toLowerCase();
  let total=0;
  document.querySelectorAll('#units .unit').forEach(el=>{
    let n=0;
    el.querySelectorAll('tbody tr').forEach(tr=>{
      const hit=!q||tr.textContent.toLowerCase().includes(q);
      tr.style.display=hit?'':'none';tr.classList.toggle('hit',!!q&&hit);
      if(hit)n++;});
    el.style.display=n?'':'none';
    if(q&&n)el.classList.add('open');
    total+=n;});
  const nh=$('#nohit');
  if(q&&!total){nh.style.display='';
    nh.innerHTML=`本词库（${$('#tot').textContent} 词）里没有「${esc(q)}」——去词典查：<a href="https://dict.hjenglish.com/jp/w/${encodeURIComponent(q)}" target="_blank" rel="noopener">沪江小D ↗</a><a href="https://jisho.org/search/${encodeURIComponent(q)}" target="_blank" rel="noopener">jisho ↗</a><a href="https://www.weblio.jp/content/${encodeURIComponent(q)}" target="_blank" rel="noopener">Weblio ↗</a>`;}
  else nh.style.display='none';
}
function bind(){
  $('#ov').onclick=e=>{const c=e.target.closest('.ovc');if(c){cur=c.dataset.b;localStorage.setItem('wbjp-book',cur);unitOpen={};renderBook();}};
  $('#tabs').onclick=e=>{const t=e.target.closest('.tab');if(t){cur=t.dataset.b;localStorage.setItem('wbjp-book',cur);unitOpen={};renderBook();}};
  $('#units').onclick=e=>{
    const uh=e.target.closest('.uh');
    if(uh){const u=uh.parentElement;unitOpen[+u.dataset.u]=!u.classList.contains('open');u.classList.toggle('open');return;}
    const tk=e.target.closest('.tick');
    if(tk){const tr=tk.closest('tr'),k=tr.dataset.k;
      if(P[k])delete P[k];else P[k]=1;
      tk.classList.toggle('done');saveLocal();paintCounts();return;}
    const zh=e.target.closest('td.zh');
    if(zh&&quiz)zh.classList.toggle('rv');};
  $('#q').oninput=applySearch;
  $('#quizb').onclick=()=>{quiz=!quiz;$('#quizb').classList.toggle('on',quiz);
    document.body.classList.toggle('quiz',quiz);
    document.querySelectorAll('td.zh').forEach(c=>c.classList.remove('rv'));};
  $('#romb').onclick=()=>{romOn=!romOn;localStorage.setItem('wbjp-rom',romOn?'1':'0');applyRom();};
  $('#exp').onclick=()=>{const us=[...document.querySelectorAll('#units .unit')];
    const anyClosed=us.some(u=>!u.classList.contains('open'));
    us.forEach(u=>{u.classList.toggle('open',anyClosed);unitOpen[+u.dataset.u]=anyClosed;});};
  $('#reset').onclick=()=>{if(!confirm(`确定清空「${cur}」的全部打卡记录吗？（${doneIn(cur)} 条）`))return;
    Object.keys(P).forEach(k=>{if(k.startsWith(cur+'-'))delete P[k];});
    saveLocal();renderBook();};
  const ui=$('#user');ui.value=user;
  ui.onchange=()=>{user=ui.value.trim()||'我';localStorage.setItem('wbjp-user',user);
    P=JSON.parse(localStorage.getItem('wbjp-p-'+user)||'{}');renderBook();};
}
bind();applyRom();renderBook();
</script>
